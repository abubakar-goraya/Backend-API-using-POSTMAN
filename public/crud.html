<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>CRUD-API</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen p-8">
