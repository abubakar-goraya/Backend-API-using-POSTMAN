<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create User</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">

        <h1 class="text-2xl font-bold text-center mb-6">Create User</h1>

        <form id="createForm">

            <div class="mb-4">
                <label for="firstName" class="block mb-1">First Name</label>
                <input type="text" id="firstName" class="w-full border rounded-lg p-2" required>
            </div>

            <div class="mb-4">
                <label for="lastName" class="block mb-1">Last Name</label>
                <input type="text" id="lastName" class="w-full border rounded-lg p-2" required>
            </div>

            <div class="mb-6">
                <label for="age" class="block mb-1">Age</label>
                <input type="number" id="age" class="w-full border rounded-lg p-2" required>
            </div>

            <button id="create" type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg">Create User</button>

        </form>
        <p id="message" class="text-center mt-4"></p>
        <p></p>
        <a href="crud.html"><button class="w-full bg-yellow-500 hover:bg-yellow-600 text-white py-2 rounded-lg">Back</button></a>
    </div>
    <script src="../app.js"></script>

</body>

</html>
